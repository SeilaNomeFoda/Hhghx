<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Key of Today</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        button {
            background-color: transparent;
            color: #fff;
            border: 2px solid #1e90ff;
            padding: 14px 26px;
            font-size: 18px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: rgba(30,144,255,0.15);
        }

        .key {
            margin-top: 20px;
            font-size: 20px;
            user-select: all;
        }

        .hint {
            margin-top: 8px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="container">
    <button onclick="showKey()">Gerar Key</button>

    <div class="key" id="keyText"></div>
    <div class="hint">Clique na key para copiar</div>
</div>

<script>

    function keyOfToday() {
        const now = new Date(Date.now() - 3 * 60 * 60 * 1000); // Brasília
        const seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
        const index = seed % keys.length;
        return keys[index];
    }

    function showKey() {
        const key = keyOfToday();
        const el = document.getElementById("keyText");
        el.textContent = key;

        el.onclick = () => {
            navigator.clipboard.writeText(key);
        };
    }
</script>

</body>
</html>
